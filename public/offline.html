<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f1e5" />
    <title>DashLife - Hors ligne</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f1e5; --fg: #3a3128; --muted: #7a6d60; --btn: #7a4f33; --btn-fg: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d0e11; --fg: #eeeff3; --muted: #9a9ca5; --btn: #d8c08c; --btn-fg: #1a1a1a; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: var(--bg); color: var(--fg); text-align: center;
        font-family: "Patrick Hand", cursive, system-ui, sans-serif;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.6rem; margin: 20px 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; font-size: 1.05rem; }
      button {
        border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-size: 1rem;
        background: var(--btn); color: var(--btn-fg); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon/android-chrome-192x192.png" alt="DashLife" />
      <h1>Vous êtes hors ligne</h1>
      <p>DashLife a besoin d'une connexion pour charger vos données.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload())
    </script>
  </body>
</html>
